name: CI

# Runs only when changes land on main (direct push or merged pull request).
on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to main cancels an older run still in progress.
concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Bun's global package cache: reused until bun.lock changes.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Next.js incremental build cache: exact hit when sources are unchanged,
      # otherwise falls back to the latest cache for the same lockfile.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/next.config.ts', 'packages/contracts/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build web
        run: bun run --cwd apps/web build
